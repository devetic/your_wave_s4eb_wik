services:
  - type: web
    name: your-wave-api
    env: node
    plan: free
    buildCommand: npm install && npm run build:web && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MUSIC_DIR
        value: /opt/render/project/src
      - key: CORS_ORIGIN
        sync: false
